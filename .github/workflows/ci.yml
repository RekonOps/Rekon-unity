# ============================================
# Unity UPM 패키지 CI 워크플로우
# ============================================
# 트리거: main/develop 브랜치 push, main 대상 PR
# 목적: Unity 라이선스 없이 실행 가능한 유효성 검사
#       - package.json JSON 파싱 검사
#       - 필수 파일 존재 여부 확인
#       - CHANGELOG 형식 검사

name: Unity CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: UPM 패키지 유효성 검사
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 체크아웃
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      # 2. package.json JSON 유효성 검사
      - name: package.json JSON 유효성 검사
        run: |
          echo "package.json 파싱 검사 중..."
          python3 -c "
          import json, sys
          try:
              with open('package.json', 'r') as f:
                  data = json.load(f)
              print('package.json 파싱 성공')

              # 필수 필드 확인
              required = ['name', 'version', 'displayName', 'description', 'unity']
              missing = [k for k in required if k not in data]
              if missing:
                  print(f'누락된 필수 필드: {missing}')
                  sys.exit(1)

              print(f'패키지명: {data[\"name\"]}')
              print(f'버전: {data[\"version\"]}')
              print(f'Unity 최소 버전: {data[\"unity\"]}')
              print('모든 필수 필드 존재 확인')
          except json.JSONDecodeError as e:
              print(f'JSON 파싱 오류: {e}')
              sys.exit(1)
          except FileNotFoundError:
              print('package.json 파일을 찾을 수 없습니다')
              sys.exit(1)
          "

      # 3. 필수 파일 존재 여부 확인
      - name: 필수 파일 구조 확인
        run: |
          echo "필수 파일 존재 여부 확인 중..."
          REQUIRED_FILES=(
            "package.json"
            "package.json.meta"
            "README.md"
            "CHANGELOG.md"
            "LICENSE.md"
            "Runtime"
            "Editor"
          )

          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$f" ]; then
              echo "누락: $f"
              MISSING=$((MISSING + 1))
            else
              echo "확인: $f"
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "누락된 필수 파일/디렉토리: ${MISSING}개"
            exit 1
          fi
          echo "모든 필수 파일 존재 확인"

      # 4. Assembly Definition 파일 확인 (Runtime, Editor)
      - name: Assembly Definition 파일 확인
        run: |
          echo "Assembly Definition (.asmdef) 파일 검색 중..."
          ASMDEF_COUNT=$(find . -name "*.asmdef" | wc -l)
          echo "발견된 .asmdef 파일: ${ASMDEF_COUNT}개"
          find . -name "*.asmdef" | while read f; do
            echo "  - $f"
            python3 -c "
          import json, sys
          with open('$f') as fp:
              try:
                  json.load(fp)
                  print('    JSON 유효')
              except Exception as e:
                  print(f'    JSON 오류: {e}')
                  sys.exit(1)
            "
          done

          if [ $ASMDEF_COUNT -lt 1 ]; then
            echo "경고: .asmdef 파일이 없습니다"
          fi
